<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame: Form</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body style="background:#fff;padding:16px">
  <h3 id="frame-heading">I am inside an iframe</h3>
  <form id="frame-form" novalidate>
    <div class="form-row">
      <div class="form-group">
        <label for="frame-name">Name</label>
        <input type="text" id="frame-name" name="name" data-testid="frame-name" placeholder="Type your name">
      </div>
      <div class="form-group">
        <label for="frame-select">Plan</label>
        <select id="frame-select" name="plan"><option value="free">Free</option><option value="pro">Pro</option><option value="team">Team</option></select>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="frame-checkbox" name="agree"> I agree</label>
    <button type="submit" class="btn btn-primary" id="frame-submit" data-testid="frame-submit">Submit</button>
  </form>
  <p id="frame-result" data-testid="frame-result" style="margin-top:10px"></p>
  <script>
    document.getElementById('frame-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('frame-name').value.trim();
      const text = name
        ? `Submitted: ${name}, plan=${document.getElementById('frame-select').value}, agree=${document.getElementById('frame-checkbox').checked}`
        : 'Name is required';
      document.getElementById('frame-result').textContent = text;
      if (window.parent !== window) window.parent.postMessage({ source: 'frame', text }, location.origin);
    });
  </script>
</body>
</html>
